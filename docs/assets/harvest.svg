<rect x="467.75" y="150" width="87" height="26" rx="13" style="fill:var(--ly-f);stroke:var(--ly)" stroke-opacity=".45" stroke-width="1.1"/><text class="mono" x="478.75" y="167.5" font-size="12" style="fill:var(--ly)">tdd-guard</text>
