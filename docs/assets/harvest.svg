<text class="mu" x="644" y="146" font-size="12">MIT or Apache-2.0: rewrite. Others: ideas only.</text>
<rect x="590" y="178" width="334" height="70" rx="12" style="fill:var(--card);stroke:var(--line)" stroke-width="1.25"/>
