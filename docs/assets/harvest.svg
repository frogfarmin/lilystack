<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 596" width="960" height="596" role="img" aria-labelledby="t d">
<title id="t">How the Lilystack harvest worked</title>
<desc id="d">Four research agents read 25 top repositories at fixed commits. Text and rules came from twelve MIT sources (gstack, spec-kit, compound-engineering, agent-skills, ECC, superpowers, humanizer, ponytail, karpathy-skills, tdd-guard, hallmark, Elaya) and three Apache-2.0 sources (the plugins and skills of Anthropic, and impeccable), changed. Ideas only came from mattpocock, humanlayer, Trail of Bits, task-observer and hooks-mastery. Not taken: destructive_command_guard (a rider against Anthropic), claude-code (all rights reserved), the docx, pdf, pptx and xlsx skills (no derivatives), planning-with-files (a Stop gate), wshobson agents (orchestration), caveman (it sets a voice). The steps: read the license, keep the questions, checklists, rules and output formats, remove the runtime. The result: 32 skills, 5 hooks, 1 lens agent, 46 evals.</desc>
<style>
  svg{--bg:#f6faf7;--bg2:#eef6f8;--card:#ffffff;--line:#d5e3db;--tx:#0f1f17;--mu:#55645c;--th:#3f51b5;--th-f:#eef0ff;--pl:#7c3aed;--pl-f:#f4efff;--ck:#0f766e;--ck-f:#e9f8f5;--sh:#b45309;--sh-f:#fff5e8;--sf:#be123c;--sf-f:#fff0f3;--an:#4d7c0f;--an-f:#f3f9e8;--ly:#047857;--ly-f:#e8f8f0;--pad1:#15803d;--pad2:#22a352;--pad3:#4cc574;--padv:#0e5e2c;--pet:#f9a8c9;--pet2:#fde4ee;--core:#f5c542;--rip:#9cc9b4;}
  @media (prefers-color-scheme: dark){svg{--bg:#0c1411;--bg2:#0b161b;--card:#131d19;--line:#25352e;--tx:#e7f2ec;--mu:#97a89f;--th:#9fa8ff;--th-f:#15172d;--pl:#c4a6ff;--pl-f:#1b1529;--ck:#5fd4c4;--ck-f:#0d2724;--sh:#f4b860;--sh-f:#231a0e;--sf:#ff8fa8;--sf-f:#261219;--an:#a3d65c;--an-f:#151d0e;--ly:#5ee0a8;--ly-f:#0c2119;--pad1:#1f9d50;--pad2:#2fb862;--pad3:#57d283;--padv:#0b4a23;--pet:#f58ab5;--pet2:#f9c6da;--core:#f5c542;--rip:#2c5244;}}
  text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;fill:var(--tx)}
  .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}
  .mu{fill:var(--mu)}
  .rip{transform-box:fill-box;transform-origin:center;animation:rip 6s ease-out infinite;opacity:0}
  .rip2{animation-delay:2s} .rip3{animation-delay:4s}
  .bob{animation:bob 5s ease-in-out infinite}
  @keyframes rip{0%{transform:scale(.55);opacity:0}20%{opacity:.85}100%{transform:scale(1.18);opacity:0}}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
  @media (prefers-reduced-motion: reduce){.rip,.bob{animation:none} .rip{opacity:.5}}
</style>
