<text x="36" y="522" font-size="13.5"><tspan class="mono" font-weight="700" style="fill:var(--sf)">guard &lt;dir&gt;</tspan> starts careful, secrets, secure and freeze with one call.</text>
<text class="mu" x="36" y="544" font-size="12.5">A guard matches text, so it is a guardrail, not a security boundary. Claude Code permission rules are the stronger layer.</text>
