<rect x="720" y="106" width="53" height="30" rx="15.0" style="fill:var(--sh-f);stroke:var(--sh)" stroke-opacity=".5" stroke-width="1.2"/><text x="746.5" y="126.0" font-size="14" font-weight="700" text-anchor="middle" style="fill:var(--sh)">ask</text>
<rect x="781" y="106" width="62" height="30" rx="15.0" style="fill:var(--pl-f);stroke:var(--pl)" stroke-opacity=".5" stroke-width="1.2"/><text x="812.0" y="126.0" font-size="14" font-weight="700" text-anchor="middle" style="fill:var(--pl)">warn</text>
<rect x="851" y="106" width="71" height="30" rx="15.0" style="fill:var(--ly-f);stroke:var(--ly)" stroke-opacity=".5" stroke-width="1.2"/><text x="886.5" y="126.0" font-size="14" font-weight="700" text-anchor="middle" style="fill:var(--ly)">allow</text>
<rect x="36" y="186" width="888" height="306" rx="14" style="fill:var(--card);stroke:var(--line)" stroke-width="1.25"/>
<text class="mu" x="56" y="209" font-size="12" font-weight="700">Guard</text>
<text class="mu" x="236" y="209" font-size="12" font-weight="700" text-anchor="middle">Bash</text>
<text class="mu" x="300" y="209" font-size="12" font-weight="700" text-anchor="middle">Read</text>
<text class="mu" x="364" y="209" font-size="12" font-weight="700" text-anchor="middle">Grep</text>
<text class="mu" x="446" y="209" font-size="12" font-weight="700" text-anchor="middle">Edit, Write</text>
<text class="mu" x="520" y="209" font-size="12" font-weight="700">Answers</text>
<text class="mu" x="652" y="209" font-size="12" font-weight="700">Example</text>
<rect x="37" y="222" width="886" height="54" style="fill:var(--sf-f)" fill-opacity=".45"/>
<text class="mono" x="56" y="254" font-size="14" font-weight="700" style="fill:var(--sf)">careful</text>
