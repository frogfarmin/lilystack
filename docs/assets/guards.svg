<path d="M720.8,250 L738.8,250 M733.8,245 L738.8,250 L733.8,255" fill="none" style="stroke:var(--mu)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="744.8" y="238" width="53" height="22" rx="11.0" style="fill:var(--sf-f);stroke:var(--sf)" stroke-opacity=".5" stroke-width="1.2"/><text x="771.2" y="253.3" font-size="12" font-weight="700" text-anchor="middle" style="fill:var(--sf)">deny</text>
<text class="mono" x="56" y="308" font-size="14" font-weight="700" style="fill:var(--sf)">secrets</text>
