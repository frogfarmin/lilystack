<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 566" width="960" height="566" role="img" aria-labelledby="t d">
<title id="t">How the Lilystack guards work</title>
<desc id="d">Claude calls a tool; the guards that you started read it and answer deny, ask, warn or allow. careful reads Bash and answers deny or ask. secrets reads Bash, Read, Grep, Edit and Write and answers deny or ask. secure reads Edit and Write and warns. test-first reads Edit and Write and asks. freeze reads Bash, Edit and Write and answers deny or ask.</desc>
<style>
  svg{--bg:#f6faf7;--bg2:#eef6f8;--card:#ffffff;--line:#d5e3db;--tx:#0f1f17;--mu:#55645c;--th:#3f51b5;--th-f:#eef0ff;--pl:#7c3aed;--pl-f:#f4efff;--ck:#0f766e;--ck-f:#e9f8f5;--sh:#b45309;--sh-f:#fff5e8;--sf:#be123c;--sf-f:#fff0f3;--an:#4d7c0f;--an-f:#f3f9e8;--ly:#047857;--ly-f:#e8f8f0;--pad1:#15803d;--pad2:#22a352;--pad3:#4cc574;--padv:#0e5e2c;--pet:#f9a8c9;--pet2:#fde4ee;--core:#f5c542;--rip:#9cc9b4;}
  @media (prefers-color-scheme: dark){svg{--bg:#0c1411;--bg2:#0b161b;--card:#131d19;--line:#25352e;--tx:#e7f2ec;--mu:#97a89f;--th:#9fa8ff;--th-f:#15172d;--pl:#c4a6ff;--pl-f:#1b1529;--ck:#5fd4c4;--ck-f:#0d2724;--sh:#f4b860;--sh-f:#231a0e;--sf:#ff8fa8;--sf-f:#261219;--an:#a3d65c;--an-f:#151d0e;--ly:#5ee0a8;--ly-f:#0c2119;--pad1:#1f9d50;--pad2:#2fb862;--pad3:#57d283;--padv:#0b4a23;--pet:#f58ab5;--pet2:#f9c6da;--core:#f5c542;--rip:#2c5244;}}
  text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;fill:var(--tx)}
  .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}
  .mu{fill:var(--mu)}
  .rip{transform-box:fill-box;transform-origin:center;animation:rip 6s ease-out infinite;opacity:0}
  .rip2{animation-delay:2s} .rip3{animation-delay:4s}
  .bob{animation:bob 5s ease-in-out infinite}
  @keyframes rip{0%{transform:scale(.55);opacity:0}20%{opacity:.85}100%{transform:scale(1.18);opacity:0}}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
  @media (prefers-reduced-motion: reduce){.rip,.bob{animation:none} .rip{opacity:.5}}
</style>
<rect width="960" height="566" rx="22" style="fill:var(--bg)"/>
<text x="36" y="44" font-size="20" font-weight="800">How the guards work</text>
<text class="mu" x="36" y="66" font-size="13">Each guard is a bash script. It reads a tool call before the call runs, and answers.</text>
<rect x="36" y="92" width="236" height="58" rx="12" style="fill:var(--card);stroke:var(--line)" stroke-width="1.25"/>
<text x="52" y="117" font-size="14.5" font-weight="700">Claude calls a tool</text>
<text class="mu" x="52" y="136" font-size="12">Bash, Read, Grep, Edit or Write</text>
<path d="M282,121 L308,121 M301,114 L308,121 L301,128" fill="none" style="stroke:var(--mu)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="320" y="92" width="282" height="58" rx="12" style="fill:var(--card);stroke:var(--line)" stroke-width="1.25"/>
<text x="336" y="117" font-size="14.5" font-weight="700">The guards that you started read it</text>
<text class="mu" x="336" y="136" font-size="12">Only the guards for that tool</text>
<path d="M612,121 L638,121 M631,114 L638,121 L631,128" fill="none" style="stroke:var(--mu)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
