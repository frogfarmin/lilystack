<circle cx="364" cy="303" r="8" style="fill:var(--sf)"/>
<circle cx="446" cy="303" r="8" style="fill:var(--sf)"/>
<rect x="520" y="292" width="53" height="22" rx="11.0" style="fill:var(--sf-f);stroke:var(--sf)" stroke-opacity=".5" stroke-width="1.2"/><text x="546.4" y="307.3" font-size="12" font-weight="700" text-anchor="middle" style="fill:var(--sf)">deny</text>
<rect x="578.8" y="292" width="45" height="22" rx="11.0" style="fill:var(--sh-f);stroke:var(--sh)" stroke-opacity=".5" stroke-width="1.2"/><text x="601.1" y="307.3" font-size="12" font-weight="700" text-anchor="middle" style="fill:var(--sh)">ask</text>
<text class="mono" x="652" y="308" font-size="12.5">cat ~/.ssh/id_ed25519</text>
