<rect x="843.6" y="292" width="53" height="22" rx="11.0" style="fill:var(--sf-f);stroke:var(--sf)" stroke-opacity=".5" stroke-width="1.2"/><text x="870.0" y="307.3" font-size="12" font-weight="700" text-anchor="middle" style="fill:var(--sf)">deny</text>
