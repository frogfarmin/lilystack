<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 344" width="960" height="344" role="img" aria-labelledby="t d">
<title id="t">How Lilystack and Lilypad fit</title>
<desc id="d">Lilypad holds the config: links.conf and the config files. bin/lily in Lilystack reads links.conf and makes symlinks on the two Macs. Claude Code on the Macs loads the Lilystack skills and hooks from its marketplace; Mac 1 also loads the status mod. lily pull updates Lilystack first, then Lilypad; then run lily check.</desc>
<style>
  svg{--bg:#f6faf7;--bg2:#eef6f8;--card:#ffffff;--line:#d5e3db;--tx:#0f1f17;--mu:#55645c;--th:#3f51b5;--th-f:#eef0ff;--pl:#7c3aed;--pl-f:#f4efff;--ck:#0f766e;--ck-f:#e9f8f5;--sh:#b45309;--sh-f:#fff5e8;--sf:#be123c;--sf-f:#fff0f3;--an:#4d7c0f;--an-f:#f3f9e8;--ly:#047857;--ly-f:#e8f8f0;--pad1:#15803d;--pad2:#22a352;--pad3:#4cc574;--padv:#0e5e2c;--pet:#f9a8c9;--pet2:#fde4ee;--core:#f5c542;--rip:#9cc9b4;}
  @media (prefers-color-scheme: dark){svg{--bg:#0c1411;--bg2:#0b161b;--card:#131d19;--line:#25352e;--tx:#e7f2ec;--mu:#97a89f;--th:#9fa8ff;--th-f:#15172d;--pl:#c4a6ff;--pl-f:#1b1529;--ck:#5fd4c4;--ck-f:#0d2724;--sh:#f4b860;--sh-f:#231a0e;--sf:#ff8fa8;--sf-f:#261219;--an:#a3d65c;--an-f:#151d0e;--ly:#5ee0a8;--ly-f:#0c2119;--pad1:#1f9d50;--pad2:#2fb862;--pad3:#57d283;--padv:#0b4a23;--pet:#f58ab5;--pet2:#f9c6da;--core:#f5c542;--rip:#2c5244;}}
  text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;fill:var(--tx)}
  .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}
  .mu{fill:var(--mu)}
  .rip{transform-box:fill-box;transform-origin:center;animation:rip 6s ease-out infinite;opacity:0}
  .rip2{animation-delay:2s} .rip3{animation-delay:4s}
  .bob{animation:bob 5s ease-in-out infinite}
  @keyframes rip{0%{transform:scale(.55);opacity:0}20%{opacity:.85}100%{transform:scale(1.18);opacity:0}}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
  @media (prefers-reduced-motion: reduce){.rip,.bob{animation:none} .rip{opacity:.5}}
</style>
<rect width="960" height="344" rx="22" style="fill:var(--bg)"/>
<text class="mu" x="36" y="40" font-size="13.5">Lilystack holds the builds. Lilypad holds the config. The two Macs use both.</text>
<rect x="36" y="64" width="232" height="154" rx="14" style="fill:var(--th-f);stroke:var(--th)" stroke-opacity=".35" stroke-width="1.25"/><text x="54" y="92" font-size="15" font-weight="800" style="fill:var(--th)">Lilypad: config</text><rect x="50" y="114" width="204" height="40" rx="9" style="fill:var(--card);stroke:var(--line)" stroke-width="1.1"/><text class="mono" x="64" y="139" font-size="13" font-weight="700" style="fill:var(--th)">links.conf</text><text class="mu" x="155.0" y="139" font-size="12">what goes where</text><rect x="50" y="164" width="204" height="40" rx="9" style="fill:var(--card);stroke:var(--line)" stroke-width="1.1"/><text class="mono" x="64" y="189" font-size="13" font-weight="700" style="fill:var(--th)">config</text><text class="mu" x="122.6" y="189" font-size="12">zshrc, apps</text>
<rect x="362" y="64" width="268" height="254" rx="14" style="fill:var(--ly-f);stroke:var(--ly)" stroke-opacity=".35" stroke-width="1.25"/><text x="380" y="92" font-size="15" font-weight="800" style="fill:var(--ly)">Lilystack: builds</text><rect x="376" y="114" width="240" height="40" rx="9" style="fill:var(--card);stroke:var(--line)" stroke-width="1.1"/><text class="mono" x="390" y="139" font-size="13" font-weight="700" style="fill:var(--ly)">bin/lily</text><text class="mu" x="464.8" y="139" font-size="12">links the config</text><rect x="376" y="164" width="240" height="40" rx="9" style="fill:var(--card);stroke:var(--line)" stroke-width="1.1"/><text class="mono" x="390" y="189" font-size="13" font-weight="700" style="fill:var(--ly)">skills, hooks</text><text class="mu" x="505.3" y="189" font-size="12">the plugin</text><rect x="376" y="214" width="240" height="40" rx="9" style="fill:var(--card);stroke:var(--line)" stroke-width="1.1"/><text class="mono" x="390" y="239" font-size="13" font-weight="700" style="fill:var(--ly)">mods/status</text><text class="mu" x="489.1" y="239" font-size="12">the band</text><rect x="376" y="264" width="240" height="40" rx="9" style="fill:var(--card);stroke:var(--line)" stroke-width="1.1"/><text class="mono" x="390" y="289" font-size="13" font-weight="700" style="fill:var(--ly)">agents, evals</text><text class="mu" x="505.3" y="289" font-size="12">lens, checks</text>
<rect x="724" y="64" width="200" height="154" rx="14" style="fill:var(--sh-f);stroke:var(--sh)" stroke-opacity=".35" stroke-width="1.25"/><text x="742" y="92" font-size="15" font-weight="800" style="fill:var(--sh)">The two Macs</text><rect x="738" y="114" width="172" height="40" rx="9" style="fill:var(--card);stroke:var(--line)" stroke-width="1.1"/><text class="mono" x="752" y="139" font-size="13" font-weight="700" style="fill:var(--sh)">Mac 1</text><text class="mu" x="818.7" y="139" font-size="12">plugin, mod</text><rect x="738" y="164" width="172" height="40" rx="9" style="fill:var(--card);stroke:var(--line)" stroke-width="1.1"/><text class="mono" x="752" y="189" font-size="13" font-weight="700" style="fill:var(--sh)">Mac 2</text><text class="mu" x="826.8" y="189" font-size="12">plugin</text>
<path d="M268,134 L362,134" fill="none" style="stroke:var(--mu)" stroke-width="2" stroke-linecap="round"/><path d="M354,128 L362,134 L354,140" fill="none" style="stroke:var(--mu)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text class="mu" x="315.0" y="126" font-size="11.5" text-anchor="middle">read by</text>
<path d="M630,134 L724,134" fill="none" style="stroke:var(--mu)" stroke-width="2" stroke-linecap="round"/><path d="M716,128 L724,134 L716,140" fill="none" style="stroke:var(--mu)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text class="mu" x="677.0" y="126" font-size="11.5" text-anchor="middle">symlinks</text>
<path d="M630,184 L724,184" fill="none" style="stroke:var(--mu)" stroke-width="2" stroke-linecap="round"/><path d="M716,178 L724,184 L716,190" fill="none" style="stroke:var(--mu)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text class="mu" x="677.0" y="176" font-size="11.5" text-anchor="middle">loads</text>
<text class="mu" x="724" y="244" font-size="12">Claude Code loads the plugin</text>
<text class="mu" x="724" y="262" font-size="12">from its marketplace.</text>
<text class="mu" x="724" y="290" font-size="12">lily pull: Lilystack first, then</text>
<text class="mu" x="724" y="308" font-size="12">Lilypad. Then run lily check.</text>
</svg>
