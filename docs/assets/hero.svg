<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" role="img" aria-labelledby="t d">
<title id="t">Lilystack</title>
<desc id="d">Lilystack: short rewrites of the best Claude Code skills. 32 skills, 5 safety hooks, 46/46 trigger evals pass, 18 upstream sources, no telemetry.</desc>
<style>
  svg{--bg:#f6faf7;--bg2:#eef6f8;--card:#ffffff;--line:#d5e3db;--tx:#0f1f17;--mu:#55645c;--th:#3f51b5;--th-f:#eef0ff;--pl:#7c3aed;--pl-f:#f4efff;--ck:#0f766e;--ck-f:#e9f8f5;--sh:#b45309;--sh-f:#fff5e8;--sf:#be123c;--sf-f:#fff0f3;--an:#4d7c0f;--an-f:#f3f9e8;--ly:#047857;--ly-f:#e8f8f0;--pad1:#15803d;--pad2:#22a352;--pad3:#4cc574;--padv:#0e5e2c;--pet:#f9a8c9;--pet2:#fde4ee;--core:#f5c542;--rip:#9cc9b4;}
