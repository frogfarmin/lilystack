  .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}
  .mu{fill:var(--mu)}
  .rip{transform-box:fill-box;transform-origin:center;animation:rip 6s ease-out infinite;opacity:0}
  .rip2{animation-delay:2s} .rip3{animation-delay:4s}
  .bob{animation:bob 5s ease-in-out infinite}
  @keyframes rip{0%{transform:scale(.55);opacity:0}20%{opacity:.85}100%{transform:scale(1.18);opacity:0}}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
