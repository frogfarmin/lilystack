# The offline checks from AGENTS.md, on each push to main and each pull request.
# Hardening: read-only token, no secrets, no pull_request_target, actions pinned to a commit,
# no saved git credentials. `claude plugin validate .` stays a local check.
name: checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install zsh and jq
        run: sudo apt-get update -q && sudo apt-get install -y -q zsh jq
      - name: Lint the skills
        run: zsh tests/lint-skills.zsh
      - name: Test the lint
        run: zsh tests/test-lint.zsh
      - name: Test the hooks
        run: zsh tests/test-hooks.zsh
      - name: Test bin/lily
        run: zsh tests/test-lily.zsh
